[pytest]
# Parallel by default (skills/testing/lean-suite.md); `-n 0` runs serially for debugging.
# The full-gate list and the full gate (FORGE_FULL=1): tests/conftest.py.
addopts = -n auto --dist loadgroup
# Bare `pytest` collects only the framework suite; workspace/ holds
# gitignored scratch copies whose duplicate test modules break collection.
testpaths = tests
norecursedirs = workspace .git _site* .venv*
