name = "code-verification"
description = "Verification specialist for the code-review light level, the reproduction re-run after a fix pass, and the verification of review findings at their cited location. Single-reviewer alternative to a multi-perspective board for bounded changes (risk-first trigger per skills/code_review_board/SKILL.md §1). Read-only investigator; effective enforcement depends on the host runtime."
sandbox_mode = "read-only"
