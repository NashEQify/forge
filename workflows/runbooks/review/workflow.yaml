name: review
description: "Review / validate spec(s). No code — only spec quality."
need_phrase: "review or validate a spec"
trigger: ["review"]
derived_from: "WORKFLOW.md@2026-05-09"

# Named gates: routing, board-dispatch, convergence-loop, close-bookkeeping, commit
# (5 user-decided steps + 3 engine-internal phase transitions).

steps:

  - id: phase-specify
    name: "workflow_phase=specify (engine-internal)"
    category: deterministic
    instruction: "task_status_update + create state file docs/review/YYYY-MM-DD-<slug>.md"
    completion:
      type: manual
    on_fail: block

  - id: routing
    name: "Review routing (depth + type)"
    category: classification
    routes:
      standard: [phase-execute, board-dispatch, phase-verify, convergence-loop, phase-close, close-bookkeeping, commit]
      sectional: [phase-execute, board-dispatch, phase-verify, convergence-loop, phase-close, close-bookkeeping, commit]
      architecture: [phase-execute, board-dispatch, phase-verify, convergence-loop, phase-close, close-bookkeeping, commit]
    instruction: >
      Pick the review skill based on the spec set:
      - 1 spec, standard / deep                         → spec_board (Standard or Deep)
      - 1 spec >1000 lines, foundation                  → sectional_deep_review
      - 2+ specs sharing contracts (API / NATS / models) → architecture_coherence_review
      - UI spec after functional PASS                   → spec_board (mode=ux)
      Pick mid-flow via `--complete routing --route <key>`.
    completion:
      type: manual
    on_fail: block

  - id: phase-execute
    name: "workflow_phase=execute (engine-internal)"
    category: deterministic
    instruction: "task_status_update workflow_phase=execute"
    completion:
      type: manual
    on_fail: block

  - id: board-dispatch
    name: "Board dispatch (per routing) → chief consolidates"
    category: content
    instruction: >
      Before mandatory review dispatch, load skills/_protocols/evidence-pointer-schema.md
      section 9. Capture this exact workflow/step before production; pass its owner
      to nested skills without a competing capture. Use successful capture stdout
      for run/subject metadata, preserve complete current returns, write and adopt
      an explicit decision, then check the declared policy before completion or
      review-derived task writes. Relevant fixes require retry and fresh applicable
      capture. For code, declare state/report/decision exclusions before capture.
      Dispatch the routed skill (spec_board / sectional_deep_review /
      architecture_coherence_review). Chief consolidates findings into
      the verdict artifact. Buddy owns the decision and checks decisive source
      evidence per shared Invariant 1; complete inline reports are persisted
      verbatim before downstream consumption.
      Output paths:
      - spec_board               → docs/reviews/board/{spec_name}-consolidated-pass{N}.md
      - sectional_deep_review    → docs/reviews/sectional/{spec_name}-deep.md
      - architecture_coherence_review → docs/reviews/architecture/{spec_name}-coherence.md
      At adoption Buddy writes docs/reviews/board/{task_id}-spec-verdict.md
      (task-less run: docs/reviews/board/{spec_name}-verdict.md; spec_board
      §7 adoption verdict, schema_version: 1) for whichever skill ran;
      completion binds to it, not to a historical pass file.
    skill_ref: skills/spec_board/SKILL.md
    # This step dispatches the routed skill; the pointer_check completion below
    # backs whichever runs. alternative_skill_refs declares the other Tier-1
    # reviewers it can route to (consumed by consistency_check tier1-drift).
    alternative_skill_refs:
      - skills/sectional_deep_review/SKILL.md
      - skills/architecture_coherence_review/SKILL.md
    completion:
      type: compound
      checks:
        - type: pointer_check
          source_file: "docs/reviews/board/{task_id}-spec-verdict.md"
          review_owner_workflow: self
          review_owner_step: board-dispatch
          review_policy: evidence
          source_file_fallback: "docs/reviews/board/{spec_name}-verdict.md"
          min_schema_version: 1
        - type: manual
    on_fail: block

  - id: phase-verify
    name: "workflow_phase=verify (engine-internal)"
    category: deterministic
    instruction: "task_status_update workflow_phase=verify"
    completion:
      type: manual
    on_fail: block

  - id: convergence-loop
    name: "Convergence loop on NEEDS-WORK (max 3 passes)"
    category: content
    instruction: >
      Current NEEDS-WORK completes board-dispatch under evidence policy so repair
      remains reachable. Apply existing convergence_loop limits/severity rules.
      After relevant fixes explicitly retry board-dispatch, fresh-capture and run
      the applicable verification, adopt the new explicit decision and return
      through the existing steps. Optional skip cannot satisfy required phase-close
      spec_success. PASS remains subject to existing 0C+0H policy.
    skill_ref: skills/convergence_loop/SKILL.md
    required: false
    completion:
      type: manual
    on_fail: block

  - id: phase-close
    name: "workflow_phase=close (engine-internal)"
    category: deterministic
    instruction: >
      Before review-derived task YAML writes, load evidence-review-adoption.md (section 9.4-9.6)
      and check this workflow's retained board-dispatch owner with spec_success.
      Refusal/error leaves requested board_result/readiness/spec_states unchanged.
      On success use task_status_update with the exact owner and section 9.6 mapping,
      then workflow_phase=close. Current negative evidence grants no forward readiness.
    completion:
      type: compound
      checks:
        - type: pointer_check
          source_file: "docs/reviews/board/{task_id}-spec-verdict.md"
          source_file_fallback: "docs/reviews/board/{spec_name}-verdict.md"
          min_schema_version: 1
          review_owner_workflow: self
          review_owner_step: board-dispatch
          review_policy: spec_success
        - type: manual
    on_fail: block

  - id: close-bookkeeping
    name: "Risk carry-forward (file follow-up task for unfixed findings)"
    category: content
    instruction: >
      For every verdict file written during this review, check the
      top-level YAML block `remaining_findings:`. Non-empty → file ONE
      follow-up task via task_creation/SKILL.md with the consolidated
      list. No remaining findings: skip with one-line rationale.
    skill_ref: skills/task_creation/SKILL.md
    required: false
    completion:
      type: manual
    on_fail: warn

  - id: commit
    name: "Commit + push"
    category: deterministic
    instruction: "Persist the review. Apply framework/process-map.md section Authorization to commit/push; do not publish without applicable permission."
    completion:
      type: manual
    commit_gate: true
    on_fail: block
