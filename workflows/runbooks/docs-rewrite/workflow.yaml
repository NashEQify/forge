name: docs-rewrite
description: "Rewrite reader-facing documentation reader-journey-first — structure follows the audience, not the system. Covers the architecture-doc site, the README, and positioning / intent surfaces; a from-scratch rewrite or an audience-driven re-frame."
need_phrase: "rewrite reader-facing docs / README / positioning"
trigger: ["docs-rewrite", "readme-rewrite", "positioning-rewrite"]
derived_from: "WORKFLOW.md@2026-10-23"

steps:
  # ==========================================================================
  # Phase: Research
  # ==========================================================================

  - id: task-status-research
    name: "workflow_phase=research (engine-internal)"
    category: deterministic
    instruction: "task_status_update + create state file docs/docs-rewrite/YYYY-MM-DD-<slug>.md"
    completion:
      type: manual
    on_fail: block

  - id: explore
    name: "Repo exploration via Explore subagent"
    category: content
    instruction: >
      Dispatch the Explore subagent (thoroughness: very thorough). Read
      the repo deeply — structure, layouts, recent commits, intent.md,
      agent definitions. Output: research notes.
    completion:
      type: manual
    on_fail: block

  - id: research-artefact
    name: "Write the research artefact"
    category: content
    instruction: >
      Either `research.md` at the repo root (public-OSS variant) or
      `<active-context>/research/<slug>.md` (internal). Capture findings,
      module overview, open questions, structural decision.
    completion:
      type: manual
    on_fail: block

  # ==========================================================================
  # Phase: Structure
  # ==========================================================================

  - id: audience-define
    name: "Define the audience and page plan (reader-journey-first)"
    category: content
    instruction: >
      Who reads the docs? One reader journey per persona; structure follows
      audience, not the system shape. Page plan: per page title, file name,
      core question, 3-5 content points from research, dependencies, plus
      the stale-cleanup list. Gate: mapping table research point -> page
      without gaps (WORKFLOW.md Phase: Structure).
    completion:
      type: manual
    on_fail: block

  # ==========================================================================
  # Phase: Write
  # ==========================================================================

  - id: write-docs
    name: "Write the documentation pages"
    category: content
    instruction: >
      One general-purpose writer per page (parallel where independent) into
      the target docs location from the scope (e.g. architecture-documentation/).
      Each page answers its core question; every technical claim is
      source-grounded with a file path.
    completion:
      type: manual
    on_fail: block

  # ==========================================================================
  # Phase: Coherence
  # ==========================================================================

  - id: verify
    name: "Coherence and source-grounding check"
    category: content
    instruction: >
      Buddy direct: uniform terms, transitions, no redundancy, tone; all
      file-path claims traceable; no invented features (WORKFLOW.md Phase:
      Coherence).
    completion:
      type: manual
    on_fail: block

  # ==========================================================================
  # Phase: Assemble
  # ==========================================================================

  - id: assemble
    name: "Assemble index, navigation, links and stale cleanup"
    category: content
    instruction: >
      Update the index / README entry per journey, site nav when a site
      config exists, cross-links; remove replaced pages and their live
      references (invariant 5). Local link and anchor check passes.
    completion:
      type: manual
    on_fail: block

  - id: intent-update
    name: "intent.md update (post-rewrite state)"
    category: content
    instruction: "When positioning or intent surfaces are in scope: update intent.md to the post-rewrite state."
    required: false
    completion:
      type: manual
    on_fail: warn

  # ==========================================================================
  # Phase: Review
  # ==========================================================================

  - id: ux-review
    name: "UX review (spec_board mode=ux)"
    category: content
    instruction: >
      spec_board mode=ux with board-ux-heuristic, board-ux-ia,
      board-ux-interaction on the page plan + 2-3 core pages + index.
      Gate: 0 critical + 0 high; max 1 re-review.
    skill_ref: skills/spec_board/SKILL.md
    tier1_pointer_exempt: "UX consolidation is <date>-<slug>-keyed under docs/docs-rewrite/, not an engine variable"
    completion:
      type: manual
    on_fail: block

  # ==========================================================================
  # Phase: Close
  # ==========================================================================

  - id: task-status-done
    name: "task_status_update status=done"
    category: deterministic
    instruction: "task_status_update status=done, workflow_phase=done"
    completion:
      type: manual
    on_fail: block

  - id: commit
    name: "Commit + push"
    category: deterministic
    instruction: "Persist the local result. Commit/push only as authorized by framework/process-map.md section Authorization."
    completion:
      type: manual
    commit_gate: true
    on_fail: block

  - id: deploy
    name: "Deploy (conditional)"
    category: deterministic
    instruction: >
      Only when deployment was authorized and a docs site exists: run `$FRAMEWORK_DIR/scripts/deploy-docs.sh`
      (env required: DEPLOY_REMOTE + DEPLOY_REMOTE_PATH).
    required: false
    completion:
      type: manual
    on_fail: warn
