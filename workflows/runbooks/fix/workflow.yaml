name: fix
description: "Recover active incidents within authorization, then investigate and permanently repair defects."
need_phrase: "fix a bug or handle an incident"
trigger: ["fix"]
derived_from: "WORKFLOW.md@2026-05-09"

# Named gates: root-cause, test-plan, fix-brief, brief-signoff,
# fix-execute, code-review, spec-drift-check, close-bookkeeping,
# commit-deploy (9 user-decided steps + 4 engine-internal phase
# transitions). fix-implement was split into fix-brief +
# brief-signoff + fix-execute per spec 306 §4.5 + §12 sub-task 4.
#
# Routes:
# - standard (default): root-cause → fix → risk-selected review → close
# - full: same step set; review level follows the canonical skill, not route name
# - sub-fix: nested fix-iteration in parent build — close-bookkeeping
#   excluded since parent owns task-level status

routes:
  standard: &fix_steps
    - phase-specify
    - root-cause
    - test-plan
    - phase-execute
    - fix-brief
    - brief-signoff
    - fix-execute
    - phase-verify
    - code-review
    - spec-drift-check
    - phase-close
    - close-bookkeeping
    - commit-deploy
  full: *fix_steps
  sub-fix:
    # parent owns task-level status; close-bookkeeping +
    # commit-deploy excluded. Per spec 306 §12 sub-task 4, also
    # excludes brief-signoff (parent already user-approved at
    # parent-scope brief-signoff; no nested approval).
    - phase-specify
    - root-cause
    - test-plan
    - phase-execute
    - fix-brief
    - fix-execute
    - phase-verify
    - code-review
    - spec-drift-check

steps:

  - id: phase-specify
    name: "workflow_phase=specify (engine-internal)"
    category: deterministic
    instruction: "task_status_update + create state file docs/fix/YYYY-MM-DD-<slug>.md"
    completion:
      type: manual
    on_fail: block

  - id: root-cause
    name: "Root-cause drill (Phase A)"
    category: content
    instruction: >
      Symptoms → hypotheses → drill until root cause. Do NOT patch symptoms.
      Output: hypothesis + test plan that reproduces the bug.
    skill_ref: skills/root_cause_fix/SKILL.md
    completion:
      type: manual
    on_fail: block

  - id: test-plan
    name: "Failing test reproducing the bug"
    category: content
    instruction: >
      Write one test that triggers the bug symptom, or strengthen the existing
      test that reaches its path; several routes to the defect are cases of
      that test. MUST be RED before the fix.
    completion:
      type: manual
    on_fail: block

  - id: phase-execute
    name: "workflow_phase=execute (engine-internal)"
    category: deterministic
    instruction: "task_status_update workflow_phase=execute"
    completion:
      type: manual
    on_fail: block

  - id: fix-brief
    name: "Fix brief authoring (architect-authored when substantial; Buddy-inline on DIRECT)"
    category: content
    instruction: >
      Per spec 306 §4.5 (fix-row split). Mirrors build's brief-author
      step at fix scope. Architect authors a focused fix-brief
      covering: root-cause hypothesis (from prior root-cause step),
      fix-implementation plan, scope-focused test/verification,
      RETURN-SUMMARY structure, sign-off field per spec 306 §5.2.
      The brief's test list follows the count rule: the reproduction of the
      test-plan step, one test per further behaviour the fix promises, none
      for unchanged behaviour
      (skills/_protocols/mca-brief-template-verification.md §Tests the brief
      orders). The brief is written from skills/_protocols/fix-brief-skeleton.md (first
      line `Skeleton: fix-brief <n>`): its `## Round` block names the round against the
      rounds in the task's effort budget, and its `Verdict:` line the verdict file it
      answers. DIRECT eligibility is defined by framework/direct-eligibility.md; verified
      known fixes meeting all criteria use an inline delegation.

      On external library API references in the fix scope: invoke
      `get_api_docs` BEFORE writing the fix plan (source-grounding,
      mirrors build's spec-write hook).
    skill_ref: agents/brief-architect.md
    completion:
      type: manual
    on_fail: block

  - id: brief-signoff
    name: "Brief sign-off (user approval; same step ID as build's, path-agnostic)"
    category: gate
    instruction: >
      Apply framework/process-map.md section Authorization. Record existing
      approval that covers the actual fix scope; ask only for changed
      scope/risk or a genuinely new decision (DIRECT skips). On
      `escalate:` from architect: surface to user, do not proceed
      to fix-execute. Sub-fix route omits this step (parent
      already approved at parent-scope brief-signoff per
      spec 306 §12 sub-task 4).
    completion:
      type: manual
    skip_when: "path == DIRECT or path == sub-fix"
    on_fail: escalate

  - id: fix-execute
    name: "Fix implementation (Phase B) + retest"
    category: content
    instruction: >
      MCA inline OR Buddy direct (orchestrator path). Fix-diff
      makes the RED test green per the architect-authored fix-
      brief. The reproduction of the test-plan step is the fix's test; a
      further test is written only for behaviour the fix brief lists
      (skills/testing/SKILL.md §Test design from the change). Run the
      tests that exercise the fix's changes before completing
      (skills/testing/run-strategy.md §Test selection).
    skill_ref: skills/root_cause_fix/SKILL.md
    completion:
      type: manual
    commit_gate: true
    on_fail: block

  - id: phase-verify
    name: "workflow_phase=verify (engine-internal)"
    category: deterministic
    instruction: "task_status_update workflow_phase=verify"
    completion:
      type: manual
    on_fail: block

  - id: code-review
    name: "Code review (light / L1 / L2 per spec 306 §4.4a)"
    category: content
    instruction: >
      Before mandatory review dispatch, load skills/_protocols/evidence-pointer-schema.md
      section 9. Capture this exact workflow/step before production; pass its owner
      to nested skills without a competing capture. Name the captured files and diff
      roots and the pinned history. Declare eligible state/report/decision exclusions before
      capture. Until adoption, the commissioner keeps these captured paths and pinned history
      write-free and puts records outside them or in eligible exclusions already declared
      for this capture (owner: skills/_protocols/evidence-review-capture.md §9.2). Use successful
      capture stdout for run/subject metadata, preserve complete current returns and write the
      explicit decision at docs/reviews/code/{task_id}-verdict.md. Run
      `--review-subject-check code-review --id WORKFLOW` on the exact owner before
      `--review-adopt`; adopt on success, then check the declared policy before completion
      or review-derived task writes. The completion check reads that verdict path and refuses
      an adoption held at another path. For a changed subject or relevant fix, retry and freshly capture before
      the applicable review (owner: skills/_protocols/evidence-review-adoption.md §9.4).
      Select light / L1 / L2 using skills/code_review_board/SKILL.md §1.
      Safety floors precede file counts and other size signals. DIRECT
      eligibility comes from framework/process-map.md; a fix is not
      automatically L1. Consolidation follows the actual reviewer count
      under the skill's §1.3. Test scope: a fix pass and its re-verify run
      the selected set for the fix's changes; a due broad run comes once,
      after the last pass, by the full gate's runner, and no fix brief or
      dispatch tells another actor to run the whole suite
      (skills/testing/run-strategy.md §Test selection). Tests in a fix pass:
      the fix brief gives each finding one test (a named existing test that
      is strengthened, one reproduction, or a command only), findings of one
      class share one test, and tests an earlier pass wrote per finding are
      listed for removal (skills/_protocols/fix-brief-template.md Section 5).
      A finding whose only subject is a test that exists (a surviving mutant,
      a guard no test pins, a vacuous assertion) and a test the added-tests
      check rejects change no verdict and open no fix pass or re-review of
      their own; which of them is fixed now, which is carried, and what is
      not such a finding (evidence a rule requires, wrong product behaviour,
      an owner-approved exit criterion):
      skills/code_review_board/test-findings.md. Before commissioning a fix pass or a re-review: re-reviews are at most two per
      mechanism, counted across review owners, workflows and tasks, then
      skills/convergence_loop/at-the-cap.md (owner: skills/code_review_board/verdict.md
      §Re-review); where the
      findings mainly concern machinery this solution introduced, reassess that
      machinery against the original outcome first and remove what it does not need
      through the brief or the triage; no task is filed solely because a finding
      exists (owner: agents/buddy/architecture-comprehension.md §B). Purpose: rounds
      on machinery the fix itself added, and tasks born of findings alone, cost more
      than the defect they answer. Buddy owns the decision and verifies pivotal
      claims after reading the reports or Chief consolidation.

      Verdict lines (read at completion): write the verdict from the skeleton in
      skills/code_review_board/REFERENCE.md §Verdict file skeleton and fill its lines
      before adopting it; a line added after adoption changes the adopted bytes, and
      the same decision is adopted again. The completion check refuses with
      `compound check [<n>] failed` until docs/reviews/code/{task_id}-verdict.md holds
      [1] the line `Skeleton: verdict <n>`; [2] `review: <light | L0 | L1 | L2>,
      seats: <names>` or `review: waived because <reason>`; [3] `re_reviews: <n> of 2
      on <mechanism>` (a waived or first review writes 0, a waived one `on none`; past
      the limit, the count reached, with the at-the-cap ruling); [4] the findings table with its
      `disposition` column, its header kept when there are no findings. It reads
      presence only. A form none of these fits: --force, counted, while the adoption
      check [0] still refuses (`Mandatory review adoption refused`). Retry forms of this step
      (framework/workflow-engine-cookbook.md §Iteration cap and review rounds): a fix
      pass with its re-review is `--retry code-review --reason "<what changed>"`,
      counted against the engine cap of 3 runs; a corrected capture before any
      reviewer ran is `--reason "capture-correction: <what>"`, not counted; past the
      cap the reason is `at-the-cap: <verdict path>`, naming a verdict whose
      remaining_findings list is not empty. The fix brief of a pass is written from
      skills/_protocols/fix-brief-skeleton.md; its `## Round` block names the round
      against the task's budget.

      On post-board FAIL with `target: spec_text` entries: Buddy
      dispatches MCA fix-execute + spec-text-drift-batch agent in
      parallel via two Agent tool calls in ONE message; block-commit
      both diffs on return per spec 306 §4.8.
    skill_ref: skills/code_review_board/SKILL.md
    completion:
      type: compound
      checks:
        # Engine-facing pointer keys on {task_id} — the board names its verdict
        # by task-id (skills/code_review_board/SKILL.md §7), independent of the
        # specify-gate type; {spec_name} mis-derived it when spec-name != task-id.
        # Canonical verdict name = [DISCIPLINE] (writer follows SKILL §7); this
        # pointer_check = [WORKFLOW] safety net (refuses mandatory adoption even with force on a missing/
        # non-canonical name, engine-run only). No separate consolidated pointer.
        # (Mirror of the build workflow code-review-board step.)
        - type: pointer_check
          source_file: "docs/reviews/code/{task_id}-verdict.md"
          min_schema_version: 1
          review_owner_workflow: self
          review_owner_step: code-review
          review_policy: code_success
        # Verdict lines: presence of the skeleton's lines, keyed [1] to [4] in the
        # step text. Forceable; the adoption check above still refuses under force.
        - type: file_content_check
          path: "docs/reviews/code/{task_id}-verdict.md"
          pattern: '(?m)^Skeleton: verdict [0-9]+[ \t\r]*$'
          condition: has_match
        - type: file_content_check
          path: "docs/reviews/code/{task_id}-verdict.md"
          pattern: '(?m)^review:[ \t]*(?:(?:L0|L1|L2|light)\b[^\n]*\bseats:[ \t]*[^\s<|][^\n]*|waived because[ \t]+[^\s<][^\n]*)$'
          condition: has_match
        - type: file_content_check
          path: "docs/reviews/code/{task_id}-verdict.md"
          pattern: '(?m)^re_reviews:[ \t]*[0-9]+ of [0-9]+ on[ \t]+[^\s<][^\n]*$'
          condition: has_match
        - type: file_content_check
          path: "docs/reviews/code/{task_id}-verdict.md"
          pattern: '(?m)^\|[^\n]*\bdisposition\b'
          condition: has_match
        - type: manual
    on_fail: block

  - id: spec-drift-check
    name: "Spec drift check (post-fix)"
    category: content
    instruction: >
      Post-fix check: did the fix change behaviour defined in a spec
      (Cypher templates / state machines / schemas / interface contracts)?
      Yes → spec patch in the SAME block-commit. No spec-defined behaviour
      touched: skip with one-line rationale.
    skill_ref: skills/spec_amendment_verification/SKILL.md
    tier1_pointer_exempt: "conditional spec patch inside the fix block-commit; no standalone artifact path"
    required: false
    completion:
      type: manual
    on_fail: warn

  - id: phase-close
    name: "workflow_phase=close (engine-internal)"
    category: deterministic
    instruction: "task_status_update workflow_phase=close"
    completion:
      type: manual
    on_fail: block

  - id: close-bookkeeping
    name: "Close bookkeeping (distill → emit)"
    category: content
    instruction: >
      If a workflow definition's semantic fingerprint changed, include its reviewed
      compatibility pair in the same change so retained runs can continue
      (owner: framework/workflow-compatibility.md §Reviewed workflow compatibility).

      Distill → emit: first the distill (close_retro), then the emit
      sub-checks consume it; each one-liner-skippable.

      DISTILL — close_retro (skill: skills/close_retro/SKILL.md; spec 374).
      Fires on FULL or a decision-heavy fix (orchestrator judgment); skip the
      common small fix with a one-liner (fix is the lowest §Stale-Decisions
      value — RCA-short, no ADR sub-step). On fire: Buddy dispatches the
      read-only agents/close-retro.md with this fix's artifacts (RCA root-cause
      instead of a brief, RETURN-SUMMARY, review verdict, spec-drift, ACs,
      optional docs/fix/<slug>-observations.md); it returns a retro 1-pager
      inline; Buddy writes it to docs/fix/<slug>-retro.md. Fix has no ADR
      sub-step → §Stale-Decisions stays noted in the retro (not dispatched to a
      missing ADR step).

      EMIT — consume the retro when present, else current raw-artifact
      behaviour (no regression):

      (a) lessons-learned — pass the retro's §Patterns-Emerged as `information`
      to knowledge_processor mode=process (or extract directly if close_retro
      was skipped): what was the root cause? what pattern-lesson applies?
      Persist to context.

      (b) risk follow-up — read code-review verdict file; non-empty
      `remaining_findings:` → route each entry by its `target:` via
      skills/risk_followup_routing/SKILL.md. Orthogonal to close_retro
      (routes REVIEW findings, not lessons). No remaining: skip with
      rationale.

      (c) §Framework-Feed — the retro's forge-feed-format entries land as
      forge-feed entries (this replaces the old workflow-retro safety net).
      When close_retro is SKIPPED, (c) reverts to the safety net: capture-now
      only the on-notice forge-feed entries missed during the work; skip if
      none.
    skill_ref: skills/knowledge_processor/SKILL.md
    completion:
      type: manual
    on_fail: warn

  - id: commit-deploy
    name: "Commit + deploy"
    category: deterministic
    instruction: >
      First make sure the tests that exercise the fix ran after the last code
      change (skills/testing/run-strategy.md §Test selection); run them now if
      not. A due broad run is the full gate's runner's: run it here only when
      you are that runner and it has not followed the last code change, and
      not again after a hash-checked transfer.

      Flip task status=done via the task_status_update skill — NOT a raw
      `status:` YAML edit. The skill runs the cross-task graph closure,
      plan.yaml ref sweep, atomic archive move + integrity guard, and the
      persist-gate; a hand edit silently skips all of them (half-closed
      archive, dangling blocked_by). Conditional on whether the fix closes
      the WHOLE task (sub-fix route skips — parent owns task status).

      Commit only with applicable authorization per framework/process-map.md;
      push and deploy need separate authorization, not merely docs changes. Engine
      auto-advances workflow_phase=done when this step completes
      (workflow_phase only — the task status flip is the skill call above).
    completion:
      type: manual
    commit_gate: true
    on_fail: block
