# Capability composition and required source closure. Optional selection is installer-owned.
version: 1
profiles:
  # placement: where the installation lives. project: one named project only (its .claude/ and
  # AGENTS.override.md, nothing in HOME); machine: every session of the machine (HOME surfaces).
  # The boot entry list is the same for both and lives in scripts/user_scope.py (ENTRY_UNITS).
  project:
    description: 'The app-building discipline in one named project only: Buddy as the main agent and the
      roles there, the boot entry from this checkout, no user scope. Nothing outside the project changes.'
    placement: project
    required_paths: &id002
    - agents
    - framework
    - scripts
    - skills
    - workflows
    - orchestrators
    - .claude
    capabilities: &id003
    - continuity
    - bedrock
    - council
    - frame
    - development
  full-ai-integration:
    description: 'Buddy in every session of the machine, with knowledge and continuity across projects
      (the user scope), all roles, skills, hooks and launchers, the project discipline included.'
    placement: machine
    codex_roles: true
    skills: all
    entries:
      save:
        source: workflows/runbooks/save/WORKFLOW.md
        description: Persist common knowledge and session handoff. Use when the user requests save or
          speichern; selected development contributes its exact state separately.
      housekeeping:
        source: workflows/runbooks/context_housekeeping/WORKFLOW.md
        description: Review and reconcile context ownership, routes and freshness using common continuity.
          Use when the user requests context housekeeping.
    required_paths: *id002
    capabilities: *id003
