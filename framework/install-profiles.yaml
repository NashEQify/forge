# Capability composition and required source closure. Optional selection is installer-owned.
version: 1
profiles:
  full:
    description: 'Everything: all roles, skills, hooks and launchers for software development and on-demand
      work.'
    codex_roles: true
    skills: all
    entries: &id001
      save:
        source: workflows/runbooks/save/WORKFLOW.md
        description: Persist common knowledge and session handoff. Use when the user requests save or
          speichern; selected development contributes its exact state separately.
      housekeeping:
        source: workflows/runbooks/context_housekeeping/WORKFLOW.md
        description: Review and reconcile context ownership, routes and freshness using common continuity.
          Use when the user requests context housekeeping.
    codex_boot: true
    claude_boot_block: false
    claude_setup: scripts/setup-cc.sh
    boot_files:
    - soul
    - boot
    required_paths:
    - agents
    - framework
    - scripts
    - skills
    - workflows
    - orchestrators
    - .claude
    capabilities:
    - continuity
    - bedrock
    - council
    - frame
    - development
  daily:
    description: 'Everyday knowledge work with on-demand Forge methods: knowledge maintenance, save, bedrock
      drill and the boot entry. No software tooling, roles, hooks or launchers.'
    codex_roles: false
    skills:
    - knowledge-processor
    - bedrock-drill
    entries: *id001
    codex_boot: true
    claude_boot_block: true
    claude_setup: null
    boot_files:
    - soul
    - boot-on-demand
    required_paths: []
    capabilities:
    - continuity
    - bedrock
capability_sets:
  continuity:
    skills:
    - knowledge-processor
    required_paths:
    - agents/buddy/soul.md
    - agents/buddy/boot-on-demand.md
    - framework/continuity.md
    - framework/user-scope.md
    - framework/installation-activation.md
    - scripts/continuity.py
    - scripts/user_scope.py
    - scripts/git-status-check.sh
    - workflows/runbooks/save/WORKFLOW.md
    - workflows/runbooks/context_housekeeping/WORKFLOW.md
    - skills/knowledge_processor/SKILL.md
    - skills/knowledge_processor/modes/process.md
    - skills/knowledge_processor/modes/user-signal.md
    - skills/knowledge_processor/modes/wrap-up.md
    - skills/knowledge_processor/reference/brain-forward.md
    - skills/knowledge_processor/reference/concepts.md
  bedrock:
    skills:
    - bedrock-drill
    required_paths:
    - skills/bedrock_drill/SKILL.md
    - skills/bedrock_drill/REFERENCE.md
    - skills/_protocols/analysis-mode-gate.md
    - skills/_protocols/dispatch-template.md
  council:
    skills:
    - council
    roles:
    - council-member
    - council-chief
    - council-adversary
    - plan-adversary
    required_paths:
    - skills/council/SKILL.md
    - skills/_protocols/plan-review.md
    - skills/_protocols/context-isolation.md
    - skills/_protocols/dispatch-template.md
    - skills/_protocols/consolidation-preservation.md
    - skills/_protocols/content-preservation.md
    - skills/_protocols/piebald-budget.md
    - skills/_protocols/analysis-mode-gate.md
    - skills/_protocols/evidence-pointer-schema.md
    - skills/_protocols/discourse.md
    - agents/council-member.md
    - agents/council-chief.md
    - agents/council-adversary.md
    - agents/plan-adversary.md
    - agents/_protocols/reviewer-reasoning-trace.md
    - agents/_protocols/first-principles-check.md
  frame:
    skills:
    - frame
    depends_on:
    - bedrock
    roles:
    - plan-adversary
    required_paths:
    - skills/frame/SKILL.md
    - skills/frame/REFERENCE.md
    - skills/_protocols/plan-review.md
    - skills/_protocols/analysis-mode-gate.md
    - skills/_protocols/cross-phase-source-grounding.md
    - skills/_protocols/dispatch-template.md
    - agents/plan-adversary.md
  development:
    required_paths:
    - agents/buddy/boot.md
    - agents/buddy/operational.md
    - framework/development-continuation.md
    - framework/workflow-compatibility.yaml
    - framework/workflow-compatibility.md
    - scripts/development_continuation.py
    - scripts/workflow_engine.py
    - scripts/plan_engine.py
    - workflows/runbooks/save/workflow.yaml
    - workflows/runbooks/context_housekeeping/workflow.yaml
installation_required_paths:
- framework/install-profiles.yaml
- scripts/forge_install.py
